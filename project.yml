name: Maske
options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
# The app has no networking code and no third-party code. MaskeCore (the engine) is shared
# with the Swift package next to this file, which also builds the `maske` test tool.
configs:
  Debug: debug
  Release: release
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
targets:
  Maske:
    type: application
    platform: iOS
    sources:
      - path: Sources/MaskeCore
      - path: Sources/MaskeApp
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: Maske
        PRODUCT_BUNDLE_IDENTIFIER: com.feiyangtang.Maske
        # Release scripts pass the team; local builds sign automatically.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maske
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # No encryption beyond what iOS provides, so TestFlight and App Review don't ask.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "Maske uses the camera to scan your document. The scan stays on your iPhone."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 TangSpark. Apache License 2.0."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEAD_CODE_STRIPPING: YES
